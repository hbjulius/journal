<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tagwerk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<meta name="theme-color" content="#E9E8E3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --paper:#E9E8E3; --panel:#FBFBF9; --ink:#1E2022; --ink2:#5A5D60; --line:#CFCFC8;
  --vater:#24506E; --eigen:#5E6E2A; --alarm:#B4342A; --ok:#3E7A4F; --tap:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea,select{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;min-height:52px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:none;min-height:76px}
select{appearance:none;-webkit-appearance:none}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:20px;font-weight:700;margin:26px 0 10px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.view{display:none;padding:18px 16px 0;max-width:560px;margin:0 auto}
.view.on{display:block}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:env(safe-area-inset-top)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.pill.alarm{border-color:var(--alarm);color:var(--alarm)}
/* Laufzettel: panel with coloured spine encoding the Bereich */
.zettel{background:var(--panel);border:1.5px solid var(--line);border-left-width:8px;border-radius:6px;padding:12px 14px;margin-bottom:10px;position:relative}
.zettel.vater{border-left-color:var(--vater)}
.zettel.eigen{border-left-color:var(--eigen)}
.zettel.done{opacity:.55}
.zettel.done .t{text-decoration:line-through}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t{font-weight:600;word-break:break-word}
.chk{width:34px;height:34px;flex:none;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:20px;line-height:1}
.chk.on{background:var(--ink);color:var(--panel)}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px;color:#fff;display:inline-block}
.tag.vater{background:var(--vater)}.tag.eigen{background:var(--eigen)}
.due{font-size:14px;font-weight:600}
.due.over{color:var(--alarm)}.due.today{color:var(--ok)}
.btn{min-height:var(--tap);border-radius:10px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--ink)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:44px;width:auto;padding:0 14px;font-size:15px;border-width:1.5px}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.warn{border-color:var(--alarm);color:var(--alarm)}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:48px;font-weight:700}
.seg button.on.vater{background:var(--vater);color:#fff}
.seg button.on.eigen{background:var(--eigen);color:#fff}
.stack>*+*{margin-top:10px}
.haupt{border:2.5px solid var(--ink);border-radius:10px;padding:14px;background:var(--panel)}
.haupt .lbl{font-weight:800;font-size:15px;margin-bottom:8px}
.haupt textarea{border:0;padding:0;min-height:60px;font-size:22px;font-weight:700;line-height:1.2;background:transparent}
.neben textarea{min-height:52px;font-size:17px}
.empty{padding:18px 4px;color:var(--ink2)}
.fb{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:14px}
.fb.now{border:2.5px solid var(--ink)}
.fb label{display:block;font-weight:700;margin:10px 0 6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1.5px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;min-height:64px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button.on{color:var(--ink)}
.tabs button .ico{font-size:22px;line-height:1}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:34px;font-weight:300;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(30,32,34,.45);display:none;z-index:10}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;z-index:11;transform:translateY(100%);transition:transform .22s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h3{font-size:22px;font-weight:800;margin-bottom:14px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;display:flex;margin:8px 0}
.bar i{display:block;height:100%}
.bar .v{background:var(--vater)}.bar .e{background:var(--eigen)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.count{font-size:15px;font-weight:700;color:var(--ink2)}
.count.full{color:var(--alarm)}
details summary{list-style:none;cursor:pointer;font-weight:700;padding:14px 0;color:var(--ink2)}
details summary::-webkit-details-marker{display:none}
.hint{border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--ink2);font-size:15px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .btn{width:auto}
.notice{background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:8px;font-weight:600;margin-bottom:12px}
.x{position:absolute;top:8px;right:8px;width:36px;height:36px;color:var(--ink2);font-size:22px}
</style>
</head>
<body>

<!-- HEUTE -->
<section class="view on" id="v-heute">
  <div class="head">
    <div><div class="muted small" id="h-wtag"></div><h1 id="h-datum"></h1></div>
    <button class="pill" id="h-eingang" onclick="openEingang()">Eingang · 0</button>
  </div>

  <h2>Aufträge</h2>
  <div id="h-auftraege"></div>

  <h2>Hauptaufgabe</h2>
  <div class="haupt" id="h-haupt"></div>

  <h2>Nebenaufgaben</h2>
  <div class="stack neben" id="h-neben"></div>

  <h2>Feierabend</h2>
  <div class="fb" id="h-fb"></div>
  <div style="height:24px"></div>
</section>

<!-- PROJEKTE -->
<section class="view" id="v-projekte">
  <div class="head"><h1>Projekte</h1><span class="count" id="p-count"></span></div>
  <div id="p-aktiv"></div>
  <button class="btn" onclick="openProjektNeu()">Neues Projekt</button>
  <details><summary>Eisfach anzeigen</summary><div id="p-eis"></div></details>
  <details><summary>Abgeschlossen</summary><div id="p-fertig"></div></details>
</section>

<!-- AUFTRÄGE -->
<section class="view" id="v-auftraege">
  <div class="head"><h1>Aufträge</h1></div>
  <div id="a-offen"></div>
  <button class="btn" onclick="openAuftragNeu()">Neuer Auftrag</button>
  <details><summary>Erledigte anzeigen</summary><div id="a-fertig"></div></details>
</section>

<!-- WOCHE -->
<section class="view" id="v-woche">
  <div class="head"><h1 id="w-kw">Woche</h1></div>
  <h2>Nächster Schritt je Projekt</h2>
  <div id="w-projekte"></div>
  <h2>Termine diese Woche</h2>
  <div id="w-termine"></div>
  <h2>Letzte 14 Tage</h2>
  <div class="fb" id="w-stats"></div>
  <h2>Daten</h2>
  <div class="inline">
    <button class="btn sm" onclick="exportJson()">Sicherung speichern</button>
    <label class="btn sm" style="cursor:pointer">Sicherung laden<input type="file" accept="application/json" style="display:none" onchange="importJson(this)"></label>
  </div>
  <p class="muted small" style="margin-top:10px">Die Daten liegen nur auf diesem Gerät. Einmal die Woche sichern.</p>
</section>

<nav class="tabs">
  <button class="on" data-v="heute" onclick="show('heute')"><span class="ico">▣</span>Heute</button>
  <button data-v="projekte" onclick="show('projekte')"><span class="ico">◆</span>Projekte</button>
  <button data-v="auftraege" onclick="show('auftraege')"><span class="ico">≡</span>Aufträge</button>
  <button data-v="woche" onclick="show('woche')"><span class="ico">▦</span>Woche</button>
</nav>
<button class="fab" onclick="openQuick()" aria-label="Schnell erfassen">+</button>

<div class="sheet-bg" id="sheet-bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ---------- Daten ---------- */
const KEY='tagwerk-v1';
const MAX_AKTIV=3;
let S=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return {version:1,projekte:[],auftraege:[],tage:{},eingang:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Speichern fehlgeschlagen. Läuft die App im privaten Modus?');}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);};
const today=()=>iso(new Date());
const WT=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function fmt(d){if(!d)return'';const [y,m,t]=d.split('-');return `${t}.${m}.`;}
function tag(d){return S.tage[d]||(S.tage[d]={haupt:{text:'',bereich:'eigen',projektId:'',done:false},neben:[{text:'',bereich:'eigen',projektId:'',done:false},{text:'',bereich:'eigen',projektId:'',done:false}],geschafft:'',gedauert:''});}
function aktive(){return S.projekte.filter(p=>p.status==='aktiv');}
function proj(id){return S.projekte.find(p=>p.id===id);}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Navigation ---------- */
function show(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);render();
}
function render(){renderHeute();renderProjekte();renderAuftraege();renderWoche();}

/* ---------- Sheet ---------- */
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('sheet-bg').classList.add('on');document.getElementById('sheet').classList.add('on');}
function closeSheet(){document.getElementById('sheet-bg').classList.remove('on');document.getElementById('sheet').classList.remove('on');}
function segHtml(id,val){return `<div class="seg" id="${id}"><button class="${val==='vater'?'on vater':''}" onclick="segSet('${id}','vater')">Für Vater</button><button class="${val==='eigen'?'on eigen':''}" onclick="segSet('${id}','eigen')">Eigenes</button></div>`;}
function segSet(id,val){const s=document.getElementById(id);s.dataset.val=val;[...s.children].forEach((b,i)=>{b.className=(i===0&&val==='vater')?'on vater':(i===1&&val==='eigen')?'on eigen':'';});}
function segVal(id){const s=document.getElementById(id);return s.dataset.val||([...s.children].find(b=>b.classList.contains('on'))?.classList.contains('vater')?'vater':'eigen');}
function projSelect(id,val){const opts=aktive().map(p=>`<option value="${p.id}" ${p.id===val?'selected':''}>${esc(p.name)}</option>`).join('');return `<select id="${id}"><option value="">Kein Projekt</option>${opts}</select>`;}

/* ---------- Schnellerfassung / Eingang ---------- */
function openQuick(){
  openSheet(`<h3>Schnell erfassen</h3><div class="stack">
    <textarea id="q-text" placeholder="Idee, Aufgabe, was auch immer…" autofocus></textarea>
    <button class="btn solid" onclick="quickSave()">In den Eingang</button></div>`);
  setTimeout(()=>document.getElementById('q-text').focus(),250);
}
function quickSave(){const t=document.getElementById('q-text').value.trim();if(!t)return;S.eingang.unshift({id:uid(),text:t,ts:Date.now()});save();closeSheet();render();}
function openEingang(){
  if(!S.eingang.length){openSheet(`<h3>Eingang</h3><p class="empty">Leer. Alles zugeordnet.</p>`);return;}
  openSheet(`<h3>Eingang</h3>`+S.eingang.map(e=>`<div class="zettel"><div class="t" style="margin-bottom:10px">${esc(e.text)}</div>
    <div class="inline">
      <button class="btn sm" onclick="eingangZu('${e.id}','haupt')">Heute Haupt</button>
      <button class="btn sm" onclick="eingangZu('${e.id}','neben')">Heute Neben</button>
      <button class="btn sm" onclick="eingangZu('${e.id}','auftrag')">Auftrag</button>
      <button class="btn sm" onclick="eingangZu('${e.id}','projekt')">Projekt</button>
      <button class="btn sm ghost" onclick="eingangDel('${e.id}')">Weg</button>
    </div></div>`).join(''));
}
function eingangDel(id){S.eingang=S.eingang.filter(e=>e.id!==id);save();openEingang();render();}
function eingangZu(id,ziel){
  const e=S.eingang.find(x=>x.id===id);if(!e)return;const d=tag(today());
  if(ziel==='haupt'){d.haupt.text=e.text;d.haupt.done=false;}
  else if(ziel==='neben'){const slot=d.neben.find(n=>!n.text)||d.neben[1];slot.text=e.text;slot.done=false;}
  else if(ziel==='auftrag'){eingangDel(id);openAuftragNeu(e.text);return;}
  else if(ziel==='projekt'){eingangDel(id);openProjektNeu(e.text);return;}
  eingangDel(id);show('heute');
}

/* ---------- HEUTE ---------- */
function renderHeute(){
  const d=today(),T=tag(d),now=new Date();
  document.getElementById('h-wtag').textContent=WT[now.getDay()];
  document.getElementById('h-datum').textContent=`${now.getDate()}. ${now.toLocaleString('de-DE',{month:'long'})}`;
  const eb=document.getElementById('h-eingang');eb.textContent=`Eingang · ${S.eingang.length}`;eb.classList.toggle('alarm',S.eingang.length>0);

  const offen=S.auftraege.filter(a=>a.status==='offen').sort((a,b)=>(a.termin||'9')<(b.termin||'9')?-1:1);
  document.getElementById('h-auftraege').innerHTML=offen.length?offen.map(a=>auftragZettel(a,true)).join(''):`<div class="empty">Keine offenen Aufträge.</div>`;

  const h=T.haupt;
  document.getElementById('h-haupt').innerHTML=`<div class="row" style="align-items:flex-start">
    <button class="chk ${h.done?'on':''}" onclick="toggleDone('haupt')">${h.done?'✓':''}</button>
    <div class="grow"><div class="lbl">Das eine Ding heute</div>
      <textarea placeholder="Wenn nur das fertig wird, war der Tag gut." oninput="setTask('haupt',0,'text',this.value)">${esc(h.text)}</textarea>
      <div class="row" style="margin-top:8px">${segHtml('seg-haupt',h.bereich)}</div>
      <div style="margin-top:8px">${projSelect('sel-haupt',h.projektId)}</div>
    </div></div>`;
  bindTask('seg-haupt','sel-haupt','haupt',0);

  document.getElementById('h-neben').innerHTML=T.neben.map((n,i)=>`<div class="zettel ${n.bereich} ${n.done?'done':''}"><div class="row" style="align-items:flex-start">
    <button class="chk ${n.done?'on':''}" onclick="toggleDone('neben',${i})">${n.done?'✓':''}</button>
    <div class="grow"><textarea placeholder="Nebenaufgabe ${i+1}" oninput="setTask('neben',${i},'text',this.value)">${esc(n.text)}</textarea>
      <div class="row" style="margin-top:8px">${segHtml('seg-neben'+i,n.bereich)}</div>
      <div style="margin-top:8px">${projSelect('sel-neben'+i,n.projektId)}</div>
    </div></div></div>`).join('');
  T.neben.forEach((n,i)=>bindTask('seg-neben'+i,'sel-neben'+i,'neben',i));

  const fb=document.getElementById('h-fb');fb.classList.toggle('now',now.getHours()>=18);
  fb.innerHTML=`<label>Was ist fertig geworden?</label><textarea oninput="setTag('geschafft',this.value)">${esc(T.geschafft)}</textarea>
    <label>Was hat länger gedauert als gedacht?</label><textarea oninput="setTag('gedauert',this.value)">${esc(T.gedauert)}</textarea>`;
}
function bindTask(segId,selId,kind,i){
  const seg=document.getElementById(segId);
  seg.querySelectorAll('button').forEach((b,bi)=>b.addEventListener('click',()=>setTask(kind,i,'bereich',bi===0?'vater':'eigen')));
  document.getElementById(selId).addEventListener('change',e=>{setTask(kind,i,'projektId',e.target.value);const p=proj(e.target.value);if(p){setTask(kind,i,'bereich',p.bereich);segSet(segId,p.bereich);}});
}
function setTask(kind,i,f,v){const T=tag(today());const t=kind==='haupt'?T.haupt:T.neben[i];t[f]=v;if(f==='bereich')t.bereich=v;save();if(f==='done'||f==='bereich')renderHeuteSoft();}
function toggleDone(kind,i){const T=tag(today());const t=kind==='haupt'?T.haupt:T.neben[i];t.done=!t.done;if(t.done)t.doneAt=today();save();renderHeute();}
function renderHeuteSoft(){/* Bereich-Farbe an Nebenzetteln nachziehen ohne Fokus zu verlieren */
  const T=tag(today());document.querySelectorAll('#h-neben .zettel').forEach((z,i)=>{z.className=`zettel ${T.neben[i].bereich} ${T.neben[i].done?'done':''}`;});}
function setTag(f,v){tag(today())[f]=v;save();}

/* ---------- AUFTRÄGE ---------- */
function auftragZettel(a,heute){
  const t=today();let cls='',txt=a.termin?fmt(a.termin):'ohne Termin';
  if(a.termin&&a.status==='offen'){if(a.termin<t){cls='over';txt='überfällig · '+txt;}else if(a.termin===t){cls='today';txt='heute';}}
  return `<div class="zettel ${a.bereich} ${a.status==='fertig'?'done':''}"><div class="row">
    <button class="chk ${a.status==='fertig'?'on':''}" onclick="auftragToggle('${a.id}')">${a.status==='fertig'?'✓':''}</button>
    <div class="grow"><div class="t">${esc(a.name)}</div><div class="due ${cls}">${txt}</div></div>
    ${heute?'':`<button class="btn sm ghost" onclick="auftragDel('${a.id}')">Weg</button>`}
  </div></div>`;
}
function renderAuftraege(){
  const offen=S.auftraege.filter(a=>a.status==='offen').sort((a,b)=>(a.termin||'9')<(b.termin||'9')?-1:1);
  const fertig=S.auftraege.filter(a=>a.status==='fertig').sort((a,b)=>(b.erledigtAm||'')<(a.erledigtAm||'')?-1:1);
  document.getElementById('a-offen').innerHTML=offen.length?offen.map(a=>auftragZettel(a,false)).join(''):`<div class="empty">Nichts offen.</div>`;
  document.getElementById('a-fertig').innerHTML=fertig.length?fertig.slice(0,30).map(a=>auftragZettel(a,false)).join(''):`<div class="empty">Noch nichts erledigt.</div>`;
}
function openAuftragNeu(text=''){
  openSheet(`<h3>Neuer Auftrag</h3><div class="stack">
    <input id="a-name" placeholder="Was ist zu fertigen?" value="${esc(text)}">
    ${segHtml('a-seg','vater')}
    <input id="a-termin" type="date" value="">
    <button class="btn solid" onclick="auftragSave()">Anlegen</button></div>`);
}
function auftragSave(){const n=document.getElementById('a-name').value.trim();if(!n)return;
  S.auftraege.push({id:uid(),name:n,bereich:segVal('a-seg'),termin:document.getElementById('a-termin').value||'',status:'offen',erstellt:today()});save();closeSheet();render();}
function auftragToggle(id){const a=S.auftraege.find(x=>x.id===id);a.status=a.status==='offen'?'fertig':'offen';a.erledigtAm=a.status==='fertig'?today():'';save();render();}
function auftragDel(id){if(!confirm('Auftrag löschen?'))return;S.auftraege=S.auftraege.filter(a=>a.id!==id);save();render();}

/* ---------- PROJEKTE ---------- */
function projZettel(p){
  const akt=p.status==='aktiv';
  return `<div class="zettel ${p.bereich}">
    <div class="t" style="font-size:19px">${esc(p.name)}</div>
    ${akt?`<div class="muted small" style="margin:6px 0 4px">Nächster Schritt</div>
    <textarea style="min-height:52px" placeholder="Genau ein Schritt, nicht zwölf." oninput="projSet('${p.id}','naechster',this.value)">${esc(p.naechster||'')}</textarea>
    <div class="inline" style="margin-top:10px"><button class="btn sm ghost" onclick="projStatus('${p.id}','eis')">Auf Eis</button><button class="btn sm ghost" onclick="projStatus('${p.id}','fertig')">Abgeschlossen</button></div>`
    :`<div class="muted small" style="margin:4px 0 10px">${p.naechster?esc(p.naechster):'—'}</div>
    <div class="inline"><button class="btn sm" onclick="projStatus('${p.id}','aktiv')">Aktivieren</button><button class="btn sm ghost" onclick="projDel('${p.id}')">Löschen</button></div>`}
  </div>`;
}
function renderProjekte(){
  const a=aktive(),e=S.projekte.filter(p=>p.status==='eis'),f=S.projekte.filter(p=>p.status==='fertig');
  const c=document.getElementById('p-count');c.textContent=`${a.length} / ${MAX_AKTIV} aktiv`;c.classList.toggle('full',a.length>=MAX_AKTIV);
  document.getElementById('p-aktiv').innerHTML=a.length?a.map(projZettel).join(''):`<div class="hint">Kein aktives Projekt. Drei dürfen gleichzeitig laufen — mehr nicht.</div>`;
  document.getElementById('p-eis').innerHTML=e.length?e.map(projZettel).join(''):`<div class="empty">Eisfach leer.</div>`;
  document.getElementById('p-fertig').innerHTML=f.length?f.map(projZettel).join(''):`<div class="empty">Noch nichts abgeschlossen.</div>`;
}
function openProjektNeu(text=''){
  const voll=aktive().length>=MAX_AKTIV;
  openSheet(`<h3>Neues Projekt</h3>${voll?`<div class="notice">Du hast schon ${MAX_AKTIV} aktive Projekte. Das hier landet im Eisfach.</div>`:''}<div class="stack">
    <input id="p-name" placeholder="Projektname" value="${esc(text)}">
    ${segHtml('p-seg','eigen')}
    <textarea id="p-next" placeholder="Nächster konkreter Schritt"></textarea>
    <button class="btn solid" onclick="projSave(${voll})">Anlegen</button></div>`);
}
function projSave(voll){const n=document.getElementById('p-name').value.trim();if(!n)return;
  S.projekte.push({id:uid(),name:n,bereich:segVal('p-seg'),naechster:document.getElementById('p-next').value.trim(),status:voll?'eis':'aktiv',erstellt:today()});save();closeSheet();render();}
function projSet(id,f,v){proj(id)[f]=v;save();}
function projStatus(id,st){
  if(st==='aktiv'&&aktive().length>=MAX_AKTIV){alert(`Schon ${MAX_AKTIV} aktive Projekte. Leg erst eins auf Eis.`);return;}
  const p=proj(id);p.status=st;if(st==='fertig')p.fertigAm=today();save();render();
}
function projDel(id){if(!confirm('Projekt endgültig löschen?'))return;S.projekte=S.projekte.filter(p=>p.id!==id);save();render();}

/* ---------- WOCHE ---------- */
function kw(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+3-((x.getDay()+6)%7));const w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/864e5-3+((w1.getDay()+6)%7))/7);}
function renderWoche(){
  const now=new Date();document.getElementById('w-kw').textContent=`KW ${kw(now)}`;
  const a=aktive();
  document.getElementById('w-projekte').innerHTML=a.length?a.map(p=>`<div class="zettel ${p.bereich}"><div class="t">${esc(p.name)}</div>
    <textarea style="min-height:52px;margin-top:6px" placeholder="Was ist diese Woche der eine Schritt?" oninput="projSet('${p.id}','naechster',this.value)">${esc(p.naechster||'')}</textarea></div>`).join(''):`<div class="empty">Kein aktives Projekt.</div>`;
  const mo=new Date(now);mo.setDate(now.getDate()-((now.getDay()+6)%7));const so=new Date(mo);so.setDate(mo.getDate()+6);
  const inWeek=S.auftraege.filter(x=>x.status==='offen'&&x.termin&&x.termin>=iso(mo)&&x.termin<=iso(so)).sort((x,y)=>x.termin<y.termin?-1:1);
  const over=S.auftraege.filter(x=>x.status==='offen'&&x.termin&&x.termin<iso(mo));
  document.getElementById('w-termine').innerHTML=(over.concat(inWeek)).length?over.concat(inWeek).map(x=>auftragZettel(x,true)).join(''):`<div class="empty">Keine Termine diese Woche.</div>`;

  /* Auswertung */
  let v=0,e=0,tage=0,laenger=0,geplant=0;const projHits={};
  for(let i=0;i<14;i++){const d=new Date(now);d.setDate(now.getDate()-i);const T=S.tage[iso(d)];if(!T)continue;tage++;
    if(T.haupt.text)geplant++;if(T.gedauert&&T.gedauert.trim())laenger++;
    [T.haupt,...T.neben].forEach(t=>{if(t.done&&t.text){t.bereich==='vater'?v++:e++;if(t.projektId)projHits[t.projektId]=(projHits[t.projektId]||0)+1;}});}
  const af=S.auftraege.filter(x=>x.status==='fertig'&&x.erledigtAm&&(now-new Date(x.erledigtAm))/864e5<=14);
  af.forEach(x=>x.bereich==='vater'?v++:e++);
  const tot=v+e||1;
  const hits=Object.entries(projHits).map(([id,n])=>{const p=proj(id);return p?`<div class="kv"><span>${esc(p.name)}</span><b>${n}</b></div>`:'';}).join('');
  const stale=aktive().filter(p=>!projHits[p.id]&&(!p.erstellt||(now-new Date(p.erstellt))/864e5>=7));
  document.getElementById('w-stats').innerHTML=`
    <div class="row" style="justify-content:space-between"><span><span class="tag vater">Vater</span> ${v}</span><span>${e} <span class="tag eigen">Eigenes</span></span></div>
    <div class="bar"><i class="v" style="width:${v/tot*100}%"></i><i class="e" style="width:${e/tot*100}%"></i></div>
    <div class="muted small">Erledigte Aufgaben und Aufträge nach Bereich</div>
    <div class="kv"><span>Tage mit Plan</span><b>${geplant} / 14</b></div>
    <div class="kv"><span>Tage, an denen etwas länger dauerte</span><b>${laenger}</b></div>
    ${hits?`<div style="margin-top:12px;font-weight:700">Projekte mit Fortschritt</div>${hits}`:''}
    ${stale.length?`<div class="hint" style="margin-top:12px">Ohne erledigte Aufgabe in 14 Tagen: ${stale.map(p=>esc(p.name)).join(', ')}. Eisfach?</div>`:''}`;
}

/* ---------- Sicherung ---------- */
function exportJson(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`tagwerk-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function importJson(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.projekte||!d.tage)throw 0;if(!confirm('Vorhandene Daten mit der Sicherung überschreiben?'))return;S=d;save();render();}catch(e){alert('Datei nicht lesbar.');}};r.readAsText(f);inp.value='';}

render();
</script>
</body>
